<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MP4 转 AMV 转换器</title>
<style>
body{font-family:sans-serif;padding:16px;background:#0b0d12;color:#e6ebf5;line-height:1.6}
h1{font-size:20px;text-align:center;margin:0 0 10px}
p.s{font-size:12px;color:#8b97b0;text-align:center;margin:0 0 20px}
.card{background:#141821;border:1px solid #252c3d;border-radius:12px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:#8b97b0;margin-bottom:6px}
select,input[type="file"]{width:100%;padding:10px;background:#1b2130;color:#fff;border:1px solid #252c3d;border-radius:8px;box-sizing:border-box;margin-bottom:12px;font-size:14px}
button{padding:14px;width:100%;font-size:16px;background:#4f8cff;color:#fff;border:none;border-radius:8px;font-weight:bold;margin-top:8px}
button:disabled{opacity:0.5}
#status{margin-top:14px;font-size:13px;color:#8b97b0;text-align:center;word-break:break-all}
#status.ok{color:#34d399}
#status.err{color:#f87171}
#progress{height:8px;background:#1b2130;border-radius:99px;margin-top:12px;overflow:hidden;display:none}
#progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f8cff,#7c5cff);transition:width .2s}
</style>
</head>
<body>
<h1>MP4 转 AMV</h1>
<p class="s">适用于老式 MP4 播放器，请保持短视频测试</p>

<div class="card">
<label>选择 MP4 文件</label>
<input type="file" id="file" accept="video/mp4,video/*">

<label>分辨率（AMV 限制最大 320x240）</label>
<select id="res">
<option value="128x96">128x96（最小）</option>
<option value="160x120" selected>160x120（推荐）</option>
<option value="320x240">320x240（最大）</option>
</select>

<label>帧率（AMV 通常最高 16fps）</label>
<select id="fps">
<option value="10">10 fps</option>
<option value="12" selected>12 fps</option>
<option value="15">15 fps</option>
</select>

<label>音频采样率</label>
<select id="ar">
<option value="22050" selected>22050 Hz（推荐）</option>
<option value="44100">44100 Hz</option>
</select>

<button id="go" disabled>开始转换</button>
<div id="progress"><i></i></div>
<div id="status">正在加载本地核心组件...</div>
</div>

<!-- 关键：引用你上传到 GitHub 的本地文件 -->
<script src="./ffmpeg.min.js"></script>
<script>
(function(){
'use strict';
var fileInput=document.getElementById('file');
var goBtn=document.getElementById('go');
var statusEl=document.getElementById('status');
var progEl=document.getElementById('progress');
var progBar=progEl.querySelector('i');
var ffmpeg=null;
var loaded=false;

function setStatus(msg,cls){statusEl.textContent=msg;statusEl.className=cls||''}
function setProgress(v){progEl.style.display='block';progBar.style.width=Math.round(v*100)+'%'}

// 初始化 FFmpeg (0.11.6 经典版 API)
async function initFFmpeg(){
if(loaded)return;
try{
var createFFmpeg=window.FFmpeg.createFFmpeg;
ffmpeg=createFFmpeg({
log: false,
// 指向同目录下的本地核心文件
corePath: './ffmpeg-core.js'
});
ffmpeg.setProgress(function(e){
setProgress(e.ratio);
});
await ffmpeg.load();
loaded=true;
setStatus('本地核心组件加载完成，可以开始转换');
goBtn.disabled=false;
}catch(e){
var errMsg = e && e.message ? e.message : (e && e.toString ? e.toString() : '未知错误');
setStatus('加载失败：' + errMsg, 'err');
console.error('详细错误：', e);
}
}

fileInput.onchange=function(){
if(this.files.length){
setStatus('已选择：'+this.files[0].name+'，正在准备组件...');
initFFmpeg();
}
};

goBtn.onclick=async function(){
var file=fileInput.files[0];
if(!file)return;
var res=document.getElementById('res').value;
var fps=document.getElementById('fps').value;
var ar=document.getElementById('ar').value;
goBtn.disabled=true;
setProgress(0);
setStatus('正在转换，请保持页面不关闭...');
try{
var fetchFile=window.FFmpeg.fetchFile;
ffmpeg.FS('writeFile', 'input.mp4', await fetchFile(file));
await ffmpeg.run(
'-i', 'input.mp4',
'-s', res,
'-r', fps,
'-ac', '1',
'-ar', ar,
'-vcodec', 'amv',
'-acodec', 'adpcm_ima_amv',
'output.amv'
);
var data = ffmpeg.FS('readFile', 'output.amv');
var blob = new Blob([data.buffer], {type: 'video/x-amv'});
var url = URL.createObjectURL(blob);
var a = document.createElement('a');
a.href = url;
a.download = file.name.replace(/\.[^.]+$/,'') + '.amv';
document.body.appendChild(a); a.click(); document.body.removeChild(a);
setTimeout(function(){URL.revokeObjectURL(url);}, 5000);
setStatus('✓ 转换完成！已触发下载', 'ok');
setProgress(1);
}catch(e){
var errMsg = e && e.message ? e.message : (e && e.toString ? e.toString() : '未知错误');
setStatus('转换失败：' + errMsg, 'err');
console.error('详细错误：', e);
}
goBtn.disabled=false;
};
})();
</script>
</body>
</html>
